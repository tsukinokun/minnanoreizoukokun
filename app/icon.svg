<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 冷蔵庫くん。小さくても顔がわかるように、顔を大きく・線を太くしている -->
  <g transform="rotate(-4 32 34)">
    <!-- 本体（角の丸みはわざと不ぞろい） -->
    <path d="M14 4 H48 Q56 4 56 12 V56 Q56 61 51 61 H13 Q9 61 9 57 V11 Q9 4 14 4 Z" fill="#bfe3d3" stroke="#3a2f2a" stroke-width="3" stroke-linejoin="round"/>
    <!-- 右側の影 -->
    <path d="M50 6.5 Q53.5 8 53.5 13 V55 Q53.5 58.5 50 58.5" fill="none" stroke="#96c7b3" stroke-width="3" stroke-linecap="round"/>
    <!-- 冷凍室と冷蔵室の境目 -->
    <path d="M9.5 39 Q32 40.5 55.5 38.5" fill="none" stroke="#3a2f2a" stroke-width="2.6" stroke-linecap="round"/>
    <!-- ほっぺ -->
    <ellipse cx="15.5" cy="27.5" rx="4" ry="2.6" fill="#ff9aa8"/>
    <ellipse cx="48" cy="26.5" rx="4" ry="2.6" fill="#ff9aa8"/>
    <!-- 目（右目を少しだけ大きく） -->
    <ellipse cx="23" cy="19.5" rx="4" ry="4.6" fill="#3a2f2a"/>
    <ellipse cx="40.5" cy="18.5" rx="4.3" ry="4.9" fill="#3a2f2a"/>
    <circle cx="24.4" cy="17.6" r="1.4" fill="#fff"/>
    <circle cx="42" cy="16.5" r="1.5" fill="#fff"/>
    <!-- にっこり -->
    <path d="M25.5 27 Q32 34 38.5 26.5" fill="none" stroke="#3a2f2a" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 冷蔵室の取っ手 -->
    <path d="M47.5 44 V54" stroke="#3a2f2a" stroke-width="3.4" stroke-linecap="round"/>
    <!-- スキのマグネット -->
    <path d="M20 55.5 C14 51.5 13 48 14.3 46 C15.6 44 18.6 44 20 46.4 C21.4 44 24.4 44 25.7 46 C27 48 26 51.5 20 55.5 Z" fill="#e8553a" stroke="#3a2f2a" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</svg>
